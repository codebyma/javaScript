<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통화 증가 감소</title>
    <script type="text/javascript" src="../js/common.js"> </script>
    <link type="text/css" rel="stylesheet" href="../css/common.css">
    <style>
        .up {
            color: green;
        }

        .down {
            color: red;
        }

        .same {
            color: gray;
        }
    </style>
</head>

<body>
    <div class="guide">
        <h1 class="guide__header">통화 증가 감소</h1>

        <div class="guide__view">
            <div class="guide__view-title">결과</div>
            <div id="getTodayDate" class="guide__view-text"></div>
        </div>

        <div class="guide__btn-wrap">
            <div class="guide__btn-title">증가</div>
            <button type="button" data-fn-target="getTodayDate" class="guide__btn">
                formatCurrency(123456789, 'KRW', 0,120000000, ICON_SETS['emoji'])
            </button>
        </div>
        <div class="guide__btn-wrap">
            <div class="guide__btn-title">감소</div>
            <button type="button" data-fn-target="getTodayDate" class="guide__btn">
                formatCurrency(987654321.45, 'USD', 2, 1000000000, ICON_SETS['arrows'])
            </button>
        </div>
        <div class="guide__btn-wrap">
            <div class="guide__btn-title">동일</div>
            <button type="button" data-fn-target="getTodayDate" class="guide__btn">
                formatCurrency(123456789.123, 'EUR', 3, 123456789.123, ICON_SETS['default'])
            </button>
        </div>
        <div class="guide__btn-wrap">
            <div class="guide__btn-title">아이콘 없음</div>
            <button type="button" data-fn-target="getTodayDate" class="guide__btn">
                formatCurrency(123456789.123, 'EUR', 3, 123456789.123, ICON_SETS['none'])
            </button>
        </div>
    </div>

    <script>
        /**
         * 통화 포맷 + 증감 표시 함수
         *
         * @description
         * 숫자를 통화 형식으로 포맷하고, 이전 값과 비교하여
         * 증가/감소/동일 상태를 아이콘과 함께 표시한다.
         *
         * @param {number} amount - 현재 금액
         * @param {string} [currencyCode='KRW'] - 통화 코드 (KRW, USD, EUR, JPY 등)
         * @param {number} [decimalPlaces=0] - 소수점 자리수
         * @param {?number} [previousAmount=null] - 비교 기준 금액
         * @param {{up:string, down:string, same:string}} [icons] - 상태별 아이콘 세트
         *
         * @returns {string} HTML 문자열 (span 태그 포함)
         */
        function formatCurrency(
            amount,
            currencyCode = 'KRW',
            decimalPlaces = 0,
            previousAmount = null,
            icons
        ) {
            /**
             * 통화별 locale / symbol 매핑
             * 👉 반복 생성 방지 위해 함수 외부로 빼는 것도 가능
             */
            const currencyLocaleMap = {
                KRW: 'ko-KR',
                USD: 'en-US',
                EUR: 'de-DE',
                JPY: 'ja-JP'
            };

            const currencySymbolMap = {
                KRW: '원',
                USD: '$',
                EUR: '€',
                JPY: '¥'
            };

            const locale = currencyLocaleMap[currencyCode] || 'en-US';
            const symbol = currencySymbolMap[currencyCode] || currencyCode;

            /**
             * Intl.NumberFormat 캐싱 (성능 최적화 핵심)
             * 👉 동일 옵션일 때 재사용
             */
            const formatterKey = `${locale}_${decimalPlaces}`;

            if (!formatCurrency._cache) {
                formatCurrency._cache = {};
            }

            if (!formatCurrency._cache[formatterKey]) {
                formatCurrency._cache[formatterKey] = new Intl.NumberFormat(locale, {
                    minimumFractionDigits: decimalPlaces,
                    maximumFractionDigits: decimalPlaces
                });
            }

            const formattedNumber = formatCurrency._cache[formatterKey].format(amount);

            /**
             * 통화 표시 방식 (KRW는 뒤, 나머지는 앞)
             */
            const formattedCurrency =
                currencyCode === 'KRW'
                    ? `${formattedNumber}${symbol}`
                    : `${symbol}${formattedNumber}`;

            let trendClass = '';
            let trendIcon = '';

            /**
             * 증감 비교 처리
             */
            if (typeof previousAmount === 'number' && icons) {
                if (amount > previousAmount) {
                    trendClass = 'up';
                    trendIcon = icons.up;
                } else if (amount < previousAmount) {
                    trendClass = 'down';
                    trendIcon = icons.down;
                } else {
                    trendClass = 'same';
                    trendIcon = icons.same;
                }
            }

            return `<span class="${trendClass}">${formattedCurrency}${trendIcon}</span>`;
        }

        // =========================
        // 아이콘 세트
        // =========================

        /**
         * 상태별 아이콘 정의
         */
        const ICON_SETS = {
            default: { up: '▲', down: '▼', same: '=' },
            none: { up: '', down: '', same: '' },
            emoji: { up: '🚀', down: '💀', same: '=' },
            arrows: { up: '⬆️', down: '⬇️', same: '=' }
        };

        // =========================
        // 이벤트 연결 (데모 실행용)
        // =========================

        const resultEl = document.getElementById('getTodayDate');

        const cases = [
            () => formatCurrency(123456789, 'KRW', 0, 120000000, ICON_SETS.emoji),
            () => formatCurrency(987654321.45, 'USD', 2, 1000000000, ICON_SETS.arrows),
            () => formatCurrency(123456789.123, 'EUR', 3, 123456789.123, ICON_SETS.default)
        ];

        document.querySelectorAll('.guide__btn').forEach((btn, index) => {
            btn.addEventListener('click', () => {
                resultEl.innerHTML = cases[index]();
            });
        });
    </script>

</body>

</html>
